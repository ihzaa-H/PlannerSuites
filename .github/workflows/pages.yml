name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement:true switches GitHub Pages on automatically,
      # so there is no need to click Save in Settings -> Pages.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Note: build ids are stamped at commit time by scripts/stamp_build.py,
      # not here. GitHub also runs its own "pages-build-deployment" branch
      # builder on every push, and that publishes the raw repository content,
      # so anything stamped inside this workflow would be overwritten.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
