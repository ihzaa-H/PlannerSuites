name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement:true switches GitHub Pages on automatically,
      # so there is no need to click Save in Settings -> Pages.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Stamp every page with this commit and publish version.json, so a
      # browser holding a cached page reloads itself once after a deploy.
      - name: Stamp build id
        run: |
          BUILD="${GITHUB_SHA::7}"
          printf '{"build":"%s"}\n' "$BUILD" > version.json
          FILES=$(grep -rl '__BUILD_ID__' --include='*.html' . || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs sed -i "s/__BUILD_ID__/$BUILD/g"
            echo "Stamped build $BUILD into:"; echo "$FILES"
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
